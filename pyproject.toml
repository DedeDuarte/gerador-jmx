# Configuração do pacote Python: dependências, comando `harjmx` e pytest.
# É o arquivo padrão que o pip e o pytest procuram na raiz.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harjmx"
version = "0.1.0"
description = "Converte um HAR em um plano JMeter, com o Claude Code decidindo a jornada"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harjmx = "harjmx.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harjmx = ["jmx_templates.xml.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m 'not e2e'"
markers = ["e2e: roda o JMX no JMeter real contra o mock (pytest -m e2e)"]
